kind = "web"
previewPath = "/"
title = "Pedidos Fitas Gitex"
description = "Aplicação empresarial responsiva para representantes comerciais autenticarem-se e acompanharem seus pedidos e orçamentos."
version = "1.0.0"
id = "artifacts/pedidos-gitex"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19382

[services.development]
run = "pnpm --filter @workspace/pedidos-gitex run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pedidos-gitex", "run", "build" ]
serve = "static"
publicDir = "artifacts/pedidos-gitex/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19382"
BASE_PATH = "/"
