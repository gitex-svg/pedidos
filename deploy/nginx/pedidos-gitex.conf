limit_req_zone $binary_remote_addr zone=gitex_login:10m rate=10r/m;

server {
    listen 80;
    server_name pedidos.gitex.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name pedidos.gitex.com.br;

    ssl_certificate /etc/letsencrypt/live/pedidos.gitex.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pedidos.gitex.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location = /api/v1/auth/login {
        limit_req zone=gitex_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/pedidos-gitex-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/pedidos-gitex-proxy.conf;
    }
}