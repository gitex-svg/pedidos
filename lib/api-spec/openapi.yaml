      required: [id, internalNumber, representativeId, customerId, paymentTermId, carrierId, notes, discount1, discount2, discount3, discount4, grossTotal, netTotal, internalStatus, erpStatus, erpOrderNumber, submittedAt, erpSyncedAt, createdByUserId, version, createdAt, updatedAt, customerName, customerErpCode, paymentTermDescription, paymentTermErpCode, carrierName, carrierErpCode, items]
      properties:
        id: { type: string, format: uuid }
        internalNumber: { type: number }
        representativeId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        paymentTermId: { type: string, format: uuid }
        carrierId: { type: [string, "null"], format: uuid }
        notes: { type: [string, "null"] }
        discount1: { $ref: "#/components/schemas/DecimalDiscount" }
        discount2: { $ref: "#/components/schemas/DecimalDiscount" }
        discount3: { $ref: "#/components/schemas/DecimalDiscount" }
        discount4: { $ref: "#/components/schemas/DecimalDiscount" }
        grossTotal: { $ref: "#/components/schemas/MoneyTotal" }
        netTotal: { $ref: "#/components/schemas/MoneyTotal" }
        internalStatus: { type: string, enum: [DRAFT, SUBMITTED] }
        erpStatus: { type: [string, "null"], enum: [EM_ANALISE, APROVADO, FECHADO, FATURADO, REPROVADO, null] }
        erpOrderNumber: { type: [string, "null"] }
        submittedAt: { type: [string, "null"], format: date-time }
        erpSyncedAt: { type: [string, "null"], format: date-time }
        createdByUserId: { type: string, format: uuid }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        customerName: { type: string }
        customerErpCode: { type: string }
        paymentTermDescription: { type: string }
        paymentTermErpCode: { type: string }
        carrierName: { type: [string, "null"] }
        carrierErpCode: { type: [string, "null"] }
        items: { type: array, items: { $ref: "#/components/schemas/OrderItem" } }
    OrderPage:
      type: object
      additionalProperties: false
      required: [page, pageSize, totalItems, totalPages, items]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }
        items: { type: array, items: { $ref: "#/components/schemas/Order" } }
    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
      required: [email, password]
    UserRole:
      type: string
      enum: [ADMIN, REPRESENTATIVE]
    AuthUser:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        role:
          $ref: "#/components/schemas/UserRole"
        representative_id: { type: ["string", "null"] }
      required: [id, email, role, representative_id]
    AuthSession:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
      required: [user]
    CurrentUser:
      $ref: "#/components/schemas/AuthUser"
    DashboardSummary:
      type: object
      properties:
        draft_count: { type: number }
        submitted_count: { type: number }
        approved_count: { type: number }
        invoiced_count: { type: number }
        rejected_count: { type: number }
      required: [draft_count, submitted_count, approved_count, invoiced_count, rejected_count]
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]
    PriceType:
      type: string
      enum: [STANDARD, REPRESENTATIVE, CUSTOMER]
    PriceOrigin:
      type: string
      enum: [CUSTOMER, REPRESENTATIVE, STANDARD]
    UnitPriceInput:
      type: string
      description: Decimal exato, com 1 a 12 dígitos inteiros (zeros à esquerda permitidos) e de 1 a 6 casas decimais. Nunca enviar como JSON number; o servidor preserva a parte inteira e completa a fração para seis casas.
      pattern: '^[0-9]{1,12}\.[0-9]{1,6}$'
      examples: ["003.25", "999999999999.123456"]
    UnitPriceOutput:
      type: string
      description: Decimal exato normalizado com exatamente 6 casas decimais.
      pattern: '^[0-9]{1,12}\.[0-9]{6}$'
      examples: ["3.250000"]
    PriceResolutionFound:
      type: object
      additionalProperties: false
      properties:
        found: { type: boolean, const: true }
        productId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        representativeId: { type: string, format: uuid }
        unitPrice: { $ref: "#/components/schemas/UnitPriceOutput" }
        origin: { $ref: "#/components/schemas/PriceOrigin" }
        priceTableId: { type: string, format: uuid }
        priceTableErpCode: { type: string }
      required: [found, productId, customerId, representativeId, unitPrice, origin, priceTableId, priceTableErpCode]
    PriceResolutionNotFound:
      type: object
      description: Ausência de preço não é representada por zero.
      additionalProperties: false
      properties:
        found: { type: boolean, const: false }
        productId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
      required: [found, productId, customerId]
    PriceResolution:
      oneOf:
        - $ref: "#/components/schemas/PriceResolutionFound"
        - $ref: "#/components/schemas/PriceResolutionNotFound"
      discriminator:
        propertyName: found
        mapping:
          "true": "#/components/schemas/PriceResolutionFound"
          "false": "#/components/schemas/PriceResolutionNotFound"
    AmbiguousPriceResponse:
      type: object
      properties:
        error: { type: string }
        scope: { $ref: "#/components/schemas/PriceOrigin" }
        priceTableIds:
          type: array
          minItems: 2
          items: { type: string, format: uuid }
      required: [error, scope, priceTableIds]
    PageMeta:
      type: object
      properties: { page: { type: integer }, pageSize: { type: integer }, totalItems: { type: integer }, totalPages: { type: integer } }
      required: [page, pageSize, totalItems, totalPages]
    Customer:
      type: object
      properties: { id: { type: string, format: uuid }, erp_code: { type: string }, representative_id: { type: string, format: uuid }, cnpj_cpf: { type: [string, "null"] }, corporate_name: { type: string }, trade_name: { type: [string, "null"] }, city: { type: [string, "null"] }, state: { type: [string, "null"] }, active: { type: boolean } }
      required: [id, erp_code, representative_id, corporate_name, active]
    Product:
      type: object
      properties: { id: { type: string, format: uuid }, erp_id: { type: string }, code: { type: string }, description: { type: string }, collection: { type: [string, "null"] }, packaging: { type: [string, "null"] }, width: { type: [string, "null"] }, color: { type: [string, "null"] }, group_code: { type: string, maxLength: 2 }, type_code: { type: string, maxLength: 2 }, product_code: { type: string, maxLength: 4 }, reference_code: { type: string, maxLength: 8 }, active: { type: boolean } }
      required: [id, erp_id, code, description, group_code, type_code, product_code, reference_code, active]
    PaymentTerm:
      type: object
      properties: { id: { type: string, format: uuid }, erp_code: { type: string }, description: { type: string }, active: { type: boolean } }
      required: [id, erp_code, description, active]
    Carrier:
      type: object
      properties: { id: { type: string, format: uuid }, erp_code: { type: string }, name: { type: string }, active: { type: boolean } }
      required: [id, erp_code, name, active]
    CustomerPage: { allOf: [{ $ref: "#/components/schemas/PageMeta" }, { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Customer" } } }, required: [items] }] }
    ProductPage: { allOf: [{ $ref: "#/components/schemas/PageMeta" }, { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Product" } } }, required: [items] }] }
    PaymentTermPage: { allOf: [{ $ref: "#/components/schemas/PageMeta" }, { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/PaymentTerm" } } }, required: [items] }] }
    CarrierPage: { allOf: [{ $ref: "#/components/schemas/PageMeta" }, { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Carrier" } } }, required: [items] }] }
    SyncBase:
      type: object
      properties: { active: { type: boolean, default: true }, source_updated_at: { type: string, format: date-time } }
      required: [source_updated_at]
    RepresentativeSyncItem: { allOf: [{ $ref: "#/components/schemas/SyncBase" }, { type: object, properties: { erp_code: { type: string }, name: { type: string }, email: { type: [string, "null"], format: email } }, required: [erp_code, name] }] }
    CustomerSyncItem: { allOf: [{ $ref: "#/components/schemas/SyncBase" }, { type: object, properties: { erp_code: { type: string }, representative_erp_code: { type: string }, corporate_name: { type: string }, trade_name: { type: [string, "null"] }, cnpj_cpf: { type: [string, "null"] }, city: { type: [string, "null"] }, state: { type: [string, "null"] } }, required: [erp_code, representative_erp_code, corporate_name] }] }
    ProductSyncItem: { allOf: [{ $ref: "#/components/schemas/SyncBase" }, { type: object, properties: { erp_id: { type: string }, code: { type: string }, description: { type: string }, collection: { type: [string, "null"] }, packaging: { type: [string, "null"] }, width: { type: [string, "null"] }, color: { type: [string, "null"] }, group_code: { type: string, minLength: 2, maxLength: 2 }, type_code: { type: string, minLength: 2, maxLength: 2 }, product_code: { type: string, minLength: 4, maxLength: 4 }, reference_code: { type: string, minLength: 8, maxLength: 8 } }, required: [erp_id, code, description, group_code, type_code, product_code, reference_code] }] }
    PaymentTermSyncItem: { allOf: [{ $ref: "#/components/schemas/SyncBase" }, { type: object, properties: { erp_code: { type: string }, description: { type: string }, installments: { type: [integer, "null"] } }, required: [erp_code, description] }] }
    CarrierSyncItem: { allOf: [{ $ref: "#/components/schemas/SyncBase" }, { type: object, properties: { erp_code: { type: string }, name: { type: string }, tax_id: { type: [string, "null"] } }, required: [erp_code, name] }] }
    PriceTableSyncItem:
      allOf:
        - $ref: "#/components/schemas/SyncBase"
        - type: object
          description: |
            Escopo condicional: STANDARD não permite códigos de escopo;
            REPRESENTATIVE exige somente representative_erp_code; CUSTOMER
            exige somente customer_erp_code.
          properties:
            erp_code: { type: string }
            name: { type: string }
            price_type: { $ref: "#/components/schemas/PriceType" }
            representative_erp_code: { type: string }
            customer_erp_code: { type: string }
            valid_from: { type: [string, "null"], format: date-time }
            valid_until: { type: [string, "null"], format: date-time }
          required: [erp_code, name, price_type, valid_from, valid_until]
          oneOf:
            - properties:
                price_type: { const: STANDARD }
              not:
                anyOf:
                  - required: [representative_erp_code]
                  - required: [customer_erp_code]
            - properties:
                price_type: { const: REPRESENTATIVE }
              required: [representative_erp_code]
              not: { required: [customer_erp_code] }
            - properties:
                price_type: { const: CUSTOMER }
              required: [customer_erp_code]
              not: { required: [representative_erp_code] }
    PriceTableItemSyncItem:
      allOf:
        - $ref: "#/components/schemas/SyncBase"
        - type: object
          properties:
            price_table_erp_code: { type: string }
            product_erp_id: { type: string }
            unit_price: { $ref: "#/components/schemas/UnitPriceInput" }
          required: [price_table_erp_code, product_erp_id, unit_price]
    RepresentativeSyncBatch: { type: object, properties: { correlation_id: { type: string, format: uuid }, items: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/RepresentativeSyncItem" } } }, required: [items] }
    CustomerSyncBatch: { type: object, properties: { correlation_id: { type: string, format: uuid }, items: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/CustomerSyncItem" } } }, required: [items] }
    ProductSyncBatch: { type: object, properties: { correlation_id: { type: string, format: uuid }, items: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/ProductSyncItem" } } }, required: [items] }
    PaymentTermSyncBatch: { type: object, properties: { correlation_id: { type: string, format: uuid }, items: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/PaymentTermSyncItem" } } }, required: [items] }
    CarrierSyncBatch: { type: object, properties: { correlation_id: { type: string, format: uuid }, items: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/CarrierSyncItem" } } }, required: [items] }
    PriceTableSyncBatch: { type: object, properties: { correlation_id: { type: string, format: uuid }, items: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/PriceTableSyncItem" } } }, required: [items] }
    PriceTableItemSyncBatch: { type: object, properties: { correlation_id: { type: string, format: uuid }, items: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/PriceTableItemSyncItem" } } }, required: [items] }
    SyncResult:
      type: object
      properties:
        correlation_id: { type: string, format: uuid }
        received: { type: integer }
        created: { type: integer }
        updated: { type: integer }
        ignored: { type: integer }
        errors: { type: integer }
        item_errors: { type: array, items: { type: object, properties: { index: { type: integer }, external_id: { type: string }, error: { type: string } }, required: [index, error] } }
        results:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              external_id: { type: string }
              status: { $ref: "#/components/schemas/SyncItemStatus" }
              reason: { $ref: "#/components/schemas/SyncItemReason" }
              message: { type: string }
            required: [index, status]
      required: [correlation_id, received, created, updated, ignored, errors, item_errors, results]
    SyncItemStatus:
      type: string
      enum: [created, updated, ignored, error]
    SyncItemReason:
      type: string
      description: Razão estável e adequada para tratamento programático.
      enum: [STALE_SOURCE_VERSION, REPRESENTATIVE_NOT_FOUND, CUSTOMER_NOT_FOUND, PRODUCT_NOT_FOUND, PRICE_TABLE_NOT_FOUND, VALIDATION_ERROR, PERSISTENCE_ERROR]