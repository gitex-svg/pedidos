openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API da plataforma de pedidos e orçamentos Fitas Gitex
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: dashboard
  - name: admin
  - name: catalog
  - name: erp
  - name: pricing
  - name: orders
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Autentica um usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Usuário autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Encerra a sessão atual
      responses:
        "204":
          description: Sessão encerrada
  /v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Retorna o usuário autenticado
      responses:
        "200":
          description: Usuário atual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Retorna o resumo do dashboard
      responses:
        "200":
          description: Resumo do dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/admin/health:
    get:
      operationId: adminHealthCheck
      tags: [admin]
      summary: Confirma acesso administrativo autenticado
      responses:
        "200":
          description: Acesso administrativo válido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Perfil sem permissão administrativa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/customers:
    get:
      operationId: listCustomers
      tags: [catalog]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/LegacyLimit"
        - $ref: "#/components/parameters/Search"
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - $ref: "#/components/parameters/Active"
        - { name: sort, in: query, schema: { type: string, enum: [name, erpCode, city, updatedAt] } }
        - $ref: "#/components/parameters/Order"
      responses:
        "200": { description: Clientes acessíveis paginados, content: { application/json: { schema: { $ref: "#/components/schemas/CustomerPage" } } } }
        "401": { description: Não autenticado }
        "403": { description: Representante sem vínculo ativo }
  /v1/products:
    get:
      operationId: listProducts
      tags: [catalog]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/LegacyLimit"
        - $ref: "#/components/parameters/Search"
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - $ref: "#/components/parameters/Active"
        - { name: group_code, in: query, schema: { type: string, minLength: 2, maxLength: 2 } }
        - { name: type_code, in: query, schema: { type: string, minLength: 2, maxLength: 2 } }
        - { name: product_code, in: query, schema: { type: string, minLength: 4, maxLength: 4 } }
        - { name: reference_code, in: query, schema: { type: string, minLength: 8, maxLength: 8 } }
        - { name: code, in: query, schema: { type: string } }
        - { name: description, in: query, schema: { type: string } }
        - { name: collection, in: query, schema: { type: string } }
        - { name: packaging, in: query, schema: { type: string } }
        - { name: width, in: query, schema: { type: string } }
        - { name: color, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [description, erpId, productCode, updatedAt] } }
        - $ref: "#/components/parameters/Order"
      responses:
        "200": { description: Produtos paginados, content: { application/json: { schema: { $ref: "#/components/schemas/ProductPage" } } } }
        "401": { description: Não autenticado }
  /v1/payment-terms:
    get:
      operationId: listPaymentTerms
      tags: [catalog]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/LegacyLimit"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Active"
        - $ref: "#/components/parameters/Order"
      responses:
        "200": { description: Condições paginadas, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentTermPage" } } } }
  /v1/carriers:
    get:
      operationId: listCarriers
      tags: [catalog]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/LegacyLimit"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Active"
        - $ref: "#/components/parameters/Order"
      responses:
        "200": { description: Transportadoras paginadas, content: { application/json: { schema: { $ref: "#/components/schemas/CarrierPage" } } } }
  /v1/pricing/resolve:
    get:
      operationId: resolvePrice
      tags: [pricing]
      summary: Resolve o preço vigente de um produto para um cliente
      description: |
        Aplica, nesta ordem, as origens CUSTOMER, REPRESENTATIVE e STANDARD.
        A vigência é inclusiva nas duas extremidades. O representante é sempre
        obtido do cliente; nenhum identificador de representante é aceito.
        REPRESENTATIVE só pode consultar clientes do próprio vínculo e ADMIN
        pode consultar qualquer cliente. Mais de uma tabela aplicável no mesmo
        nível é erro explícito, nunca uma escolha arbitrária.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: customerId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: productId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: referenceDate
          in: query
          description: Data/hora de referência; na ausência, usa a data/hora atual do servidor.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Preço resolvido ou ausência explícita de preço
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceResolution"
        "400":
          description: Parâmetros inválidos
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401":
          description: Sessão ausente ou inválida
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "403":
          description: Cliente fora do escopo do representante autenticado
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: Cliente, produto ou representante associado não encontrado ou inativo
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: Duas ou mais tabelas vigentes contêm o produto no mesmo nível da hierarquia
          content: { application/json: { schema: { $ref: "#/components/schemas/AmbiguousPriceResponse" } } }
  /v1/orders:
    get:
      operationId: listOrders
      tags: [orders]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }, { name: status, in: query, schema: { type: string, enum: [DRAFT, SUBMITTED] } }, { name: number, in: query, schema: { type: integer } }, { name: customer, in: query, schema: { type: string } }]
      responses: { "200": { description: Pedidos paginados, content: { application/json: { schema: { $ref: "#/components/schemas/OrderPage" } } } }, "401": { description: Não autenticado } }
    post:
      operationId: createOrder
      tags: [orders]
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OrderInput" } } } }
      responses: { "201": { description: Orçamento criado, content: { application/json: { schema: { $ref: "#/components/schemas/OrderDetail" } } } }, "400": { description: Dados inválidos }, "403": { description: Somente representante pode criar } }
  /v1/orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/OrderId" }]
      responses: { "200": { description: Pedido e itens congelados, content: { application/json: { schema: { $ref: "#/components/schemas/OrderDetail" } } } }, "404": { description: Não encontrado } }
    patch:
      operationId: updateOrder
      tags: [orders]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/OrderId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OrderUpdate" } } } }
      responses: { "200": { description: Pedido atualizado, content: { application/json: { schema: { $ref: "#/components/schemas/OrderDetail" } } } }, "409": { description: Versão conflitante ou pedido submetido } }
  /v1/orders/{id}/submit:
    post:
      operationId: submitOrder
      tags: [orders]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/OrderId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/VersionInput" } } } }
      responses: { "200": { description: Pedido submetido, content: { application/json: { schema: { $ref: "#/components/schemas/OrderDetail" } } } }, "409": { description: Pedido não apto ou já submetido } }
  /v1/orders/{id}/items:
    post:
      operationId: addOrderItem
      tags: [orders]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/OrderId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OrderItemInput" } } } }
      responses: { "201": { description: Item incluído e pedido recalculado, content: { application/json: { schema: { $ref: "#/components/schemas/OrderDetail" } } } }, "409": { description: "Preço ausente, versão ou pedido submetido" } }
  /v1/orders/{id}/items/{itemId}:
    patch:
      operationId: updateOrderItem
      tags: [orders]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/OrderId" }, { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OrderItemUpdate" } } } }
      responses: { "200": { description: Item atualizado, content: { application/json: { schema: { $ref: "#/components/schemas/OrderDetail" } } } }, "409": { description: "Versão ou pedido submetido" } }
    delete:
      operationId: deleteOrderItem
      tags: [orders]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/OrderId" }, { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/VersionInput" } } } }
      responses: { "200": { description: Item removido e pedido recalculado, content: { application/json: { schema: { $ref: "#/components/schemas/OrderDetail" } } } }, "409": { description: "Versão ou pedido submetido" } }
  /v1/erp/representatives/sync:
    post:
      operationId: syncRepresentatives
      tags: [erp]
      security: [{ erpApiKey: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RepresentativeSyncBatch" } } } }
      responses: { "200": { $ref: "#/components/responses/SyncResult" }, "207": { $ref: "#/components/responses/SyncResult" }, "400": { description: Lote inválido }, "401": { description: API key inválida } }
  /v1/erp/customers/sync:
    post:
      operationId: syncCustomers
      tags: [erp]
      security: [{ erpApiKey: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CustomerSyncBatch" } } } }
      responses: { "200": { $ref: "#/components/responses/SyncResult" }, "207": { $ref: "#/components/responses/SyncResult" }, "400": { description: Lote inválido }, "401": { description: API key inválida } }
  /v1/erp/products/sync:
    post:
      operationId: syncProducts
      tags: [erp]
      security: [{ erpApiKey: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProductSyncBatch" } } } }
      responses: { "200": { $ref: "#/components/responses/SyncResult" }, "207": { $ref: "#/components/responses/SyncResult" }, "400": { description: Lote inválido }, "401": { description: API key inválida } }
  /v1/erp/payment-terms/sync:
    post:
      operationId: syncPaymentTerms
      tags: [erp]
      security: [{ erpApiKey: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentTermSyncBatch" } } } }
      responses: { "200": { $ref: "#/components/responses/SyncResult" }, "207": { $ref: "#/components/responses/SyncResult" }, "400": { description: Lote inválido }, "401": { description: API key inválida } }
  /v1/erp/carriers/sync:
    post:
      operationId: syncCarriers
      tags: [erp]
      security: [{ erpApiKey: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CarrierSyncBatch" } } } }
      responses: { "200": { $ref: "#/components/responses/SyncResult" }, "207": { $ref: "#/components/responses/SyncResult" }, "400": { description: Lote inválido }, "401": { description: API key inválida } }
  /v1/erp/price-tables/sync:
    post:
      operationId: syncPriceTables
      tags: [erp]
      summary: Sincroniza tabelas de preço por identificadores externos
      description: |
        Aceita somente códigos externos do ERP. STANDARD não recebe escopo;
        REPRESENTATIVE usa representative_erp_code; CUSTOMER usa
        customer_erp_code. UUIDs internos não fazem parte deste contrato.
      security: [{ erpApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PriceTableSyncBatch" }
      responses:
        "200": { $ref: "#/components/responses/SyncResult" }
        "207": { $ref: "#/components/responses/SyncResult" }
        "400": { description: Lote inválido, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { description: API key ausente ou inválida, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /v1/erp/price-table-items/sync:
    post:
      operationId: syncPriceTableItems
      tags: [erp]
      summary: Sincroniza preços de produtos nas tabelas
      description: |
        A tabela e o produto são identificados exclusivamente por
        price_table_erp_code e product_erp_id. unit_price é texto decimal para
        preservar precisão; UUIDs internos não são aceitos.
      security: [{ erpApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PriceTableItemSyncBatch" }
      responses:
        "200": { $ref: "#/components/responses/SyncResult" }
        "207": { $ref: "#/components/responses/SyncResult" }
        "400": { description: Lote inválido, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { description: API key ausente ou inválida, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: better-auth.session_token }
    erpApiKey: { type: http, scheme: bearer }
  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, description: "Tamanho efetivo padrão é 20; valores acima de 100 são limitados a 100. Quando informado, tem prioridade sobre limit.", schema: { type: integer, minimum: 1 } }
    LegacyLimit: { name: limit, in: query, deprecated: true, description: "Usado somente quando pageSize não é informado; na ausência de ambos o tamanho efetivo é 20.", schema: { type: integer, minimum: 1 } }
    Search: { name: search, in: query, schema: { type: string, maxLength: 200 } }
    Active: { name: active, in: query, description: Disponível a administradores; representantes sempre veem ativos, schema: { type: boolean } }
    Order: { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
    OrderId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    SyncResult:
      description: Resultado integral ou parcial do lote
      content: { application/json: { schema: { $ref: "#/components/schemas/SyncResult" } } }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    DecimalDiscount: { type: string, pattern: '^(?:0|[1-9][0-9]{0,2})(?:\.[0-9]{1,4})?$', description: Percentual decimal exato entre 0 e 100 com até quatro casas. }
    QuantityInput: { type: string, pattern: '^(?:0|[1-9][0-9]{0,13})(?:\.[0-9]{1,4})?$', description: Decimal exato positivo, até quatro casas. }
    MoneyTotal: { type: string, pattern: '^[0-9]{1,18}\.[0-9]{2}$', description: Total decimal exato, sempre duas casas. }
    VersionInput: { type: object, additionalProperties: false, required: [version], properties: { version: { type: integer, minimum: 1 } } }
    OrderInput:
      type: object
      additionalProperties: false
      required: [customerId, paymentTermId, discount1, discount2, discount3, discount4]
      properties: { customerId: { type: string, format: uuid }, paymentTermId: { type: string, format: uuid }, carrierId: { type: [string, "null"], format: uuid }, notes: { type: [string, "null"], maxLength: 5000 }, discount1: { $ref: "#/components/schemas/DecimalDiscount" }, discount2: { $ref: "#/components/schemas/DecimalDiscount" }, discount3: { $ref: "#/components/schemas/DecimalDiscount" }, discount4: { $ref: "#/components/schemas/DecimalDiscount" } }
    OrderUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties: { version: { type: integer, minimum: 1 }, customerId: { type: string, format: uuid }, paymentTermId: { type: string, format: uuid }, carrierId: { type: [string, "null"], format: uuid }, notes: { type: [string, "null"], maxLength: 5000 }, discount1: { $ref: "#/components/schemas/DecimalDiscount" }, discount2: { $ref: "#/components/schemas/DecimalDiscount" }, discount3: { $ref: "#/components/schemas/DecimalDiscount" }, discount4: { $ref: "#/components/schemas/DecimalDiscount" } }
    OrderItemInput:
      type: object
      additionalProperties: false
      required: [version, productId, quantity]
      properties: { version: { type: integer, minimum: 1 }, productId: { type: string, format: uuid }, quantity: { $ref: "#/components/schemas/QuantityInput" }, specialUnitPrice: { anyOf: [{ $ref: "#/components/schemas/UnitPriceInput" }, { type: "null" }] } }
    OrderItemUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties: { version: { type: integer, minimum: 1 }, quantity: { $ref: "#/components/schemas/QuantityInput" }, specialUnitPrice: { anyOf: [{ $ref: "#/components/schemas/UnitPriceInput" }, { type: "null" }] } }
    OrderItem:
      type: object
      additionalProperties: false
      description: Snapshot imutável do produto e preço no momento da inclusão.
      required: [id, orderId, productId, groupCode, typeCode, productCode, referenceCode, productCodeSnapshot, descriptionSnapshot, packagingSnapshot, widthSnapshot, colorSnapshot, quantity, suggestedUnitPrice, suggestedPriceOrigin, suggestedPriceTableId, suggestedPriceTableErpCode, effectiveUnitPrice, effectivePriceOrigin, isSpecialPrice, specialUnitPrice, discount1, discount2, discount3, discount4, discountsApplied, netUnitPrice, grossTotal, netTotal, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        groupCode: { type: string }
        typeCode: { type: string }
        productCode: { type: string }
        referenceCode: { type: string }
        productCodeSnapshot: { type: string }
        descriptionSnapshot: { type: string }
        packagingSnapshot: { type: [string, "null"] }
        widthSnapshot: { type: [string, "null"] }
        colorSnapshot: { type: [string, "null"] }
        quantity: { type: string, pattern: '^[0-9]+\.[0-9]{4}$' }
        suggestedUnitPrice: { $ref: "#/components/schemas/UnitPriceOutput" }
        suggestedPriceOrigin: { $ref: "#/components/schemas/PriceOrigin" }
        suggestedPriceTableId: { type: [string, "null"], format: uuid }
        suggestedPriceTableErpCode: { type: [string, "null"] }
        effectiveUnitPrice: { $ref: "#/components/schemas/UnitPriceOutput" }
        effectivePriceOrigin: { type: string, enum: [CUSTOMER, REPRESENTATIVE, STANDARD, SPECIAL] }
        isSpecialPrice: { type: boolean }
        specialUnitPrice: { anyOf: [{ $ref: "#/components/schemas/UnitPriceOutput" }, { type: "null" }] }
        discount1: { $ref: "#/components/schemas/DecimalDiscount" }
        discount2: { $ref: "#/components/schemas/DecimalDiscount" }
        discount3: { $ref: "#/components/schemas/DecimalDiscount" }
        discount4: { $ref: "#/components/schemas/DecimalDiscount" }
        discountsApplied: { type: boolean }
        netUnitPrice: { $ref: "#/components/schemas/UnitPriceOutput" }
        grossTotal: { $ref: "#/components/schemas/MoneyTotal" }
        netTotal: { $ref: "#/components/schemas/MoneyTotal" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Order:
      type: object
      additionalProperties: false
      description: Ordem persistida; identidade, estado, totais e snapshots são gerados exclusivamente pelo servidor.
      required: [id, internalNumber, representativeId, customerId, paymentTermId, carrierId, notes, discount1, discount2, discount3, discount4, grossTotal, netTotal, internalStatus, erpStatus, erpOrderNumber, submittedAt, erpSyncedAt, createdByUserId, version, createdAt, updatedAt, customerName, customerErpCode, paymentTermDescription, paymentTermErpCode, carrierName, carrierErpCode]
      properties:
        id: { type: string, format: uuid }
        internalNumber: { type: number }
        representativeId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        paymentTermId: { type: string, format: uuid }
        carrierId: { type: [string, "null"], format: uuid }
        notes: { type: [string, "null"] }
        discount1: { $ref: "#/components/schemas/DecimalDiscount" }
        discount2: { $ref: "#/components/schemas/DecimalDiscount" }
        discount3: { $ref: "#/components/schemas/DecimalDiscount" }
        discount4: { $ref: "#/components/schemas/DecimalDiscount" }
        grossTotal: { $ref: "#/components/schemas/MoneyTotal" }
        netTotal: { $ref: "#/components/schemas/MoneyTotal" }
        internalStatus: { type: string, enum: [DRAFT, SUBMITTED] }
        erpStatus: { type: [string, "null"], enum: [EM_ANALISE, APROVADO, FECHADO, FATURADO, REPROVADO, null] }
        erpOrderNumber: { type: [string, "null"] }
        submittedAt: { type: [string, "null"], format: date-time }
